name: Workspace labels

# pull_request_target runs this workflow and tools/issue_workflow.py from the default
# branch. Pull request code is never checked out or executed; only its file list is
# read through the API, so a pull request cannot abuse the write token.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Workspace labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Label by changed paths
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/issue_workflow.py pr-labels
