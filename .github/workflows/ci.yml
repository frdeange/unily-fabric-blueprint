name: Baseline CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Check repository scope and credential artifacts
        run: python tools/check_repository.py
      - name: Install development hooks
        run: python -m pip install -r requirements-dev.txt
      - name: Enforce hooks on all tracked files
        run: python -m pre_commit run --all-files --show-diff-on-failure
      - name: Check generated notebook consistency
        run: python tools/build_notebooks.py --check
      - name: Check Variable Library contract
        run: python tools/prepare_deployment.py --check-template
      - name: Run synthetic unit tests
        run: python -m unittest discover -s tests -v
