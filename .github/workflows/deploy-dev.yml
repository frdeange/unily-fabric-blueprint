name: Deploy dev environment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-dev
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out approved main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate definitions before authentication
        run: |
          python tools/check_repository.py
          python tools/build_notebooks.py --check
          python tools/prepare_deployment.py --check-template
          python -m unittest discover -s tests -v
      - name: Install pinned deployment package
        run: python -m pip install -r requirements-deploy.txt
      - name: Authenticate with Entra federation
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish approved items to Data and Vault and verify readback
        env:
          FABRIC_CICD_FILE_LOGGING_ENABLED: "false"
        run: python tools/deploy_environment.py --environment dev
