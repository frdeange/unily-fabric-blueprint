name: Verify Fabric connection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-dev
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out approved main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Recheck repository baseline
        run: |
          python tools/check_repository.py
          python tools/build_notebooks.py --check
          python -m unittest discover -s tests -v
      - name: Authenticate with Entra federation
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Verify read-only access to the dev workspaces
        env:
          FABRIC_ENVIRONMENT: dev
        run: python tools/verify_fabric_connection.py
