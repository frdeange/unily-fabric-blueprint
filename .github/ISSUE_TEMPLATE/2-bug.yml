name: "🐛 Bug"
description: "Report incorrect behavior."
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Write in English. Never include secrets, tokens, real tenant/workspace/item IDs or personal data.
        After submission, automation normalizes the title to `[Type] Area: summary` and applies emoji labels.
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue type
      description: "Fixed by this form. Do not change it."
      options:
        - "Bug"
      default: 0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: "Primary area affected. Use Repository for cross-cutting repository work."
      options:
        - "Product Analytics"
        - "Support"
        - "CI/CD"
        - "Semantic Models"
        - "Security"
        - "Repository"
    validations:
      required: true
  - type: checkboxes
    id: target-workspace
    attributes:
      label: Target workspace
      description: "Fabric workspaces this issue changes. Leave empty if none. Vault changes need a privacy review."
      options:
        - label: "Data"
        - label: "Analytics"
        - label: "Vault"
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: "What happens now. Redact identifiers and data."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: "What should happen."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps or evidence
      description: "How to reproduce, run IDs or sanitized logs."
      placeholder: |
        1. ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "Verifiable conditions for closing this issue."
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: "What this issue must not change."
      placeholder: |
        - ...
    validations:
      required: true
  - type: dropdown
    id: fabric-impact
    attributes:
      label: Fabric/data impact
      description: "Data changes require separate explicit approval before execution."
      options:
        - "No Fabric or data impact"
        - "Changes Fabric item definitions only"
        - "Changes, deletes or regenerates Fabric data"
    validations:
      required: true
  - type: textarea
    id: impact-notes
    attributes:
      label: Impact notes
      description: "Affected items, environments, rollback or approval notes."
    validations:
      required: false
